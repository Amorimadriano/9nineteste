name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'tsconfig.json'
      - 'tailwind.config.ts'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --omit=optional

      - name: Install Rollup native binary for Linux runner
        run: npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Resolve and validate Supabase environment
        shell: bash
        env:
          INPUT_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          INPUT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          DEFAULT_SUPABASE_URL="https://gcmxhuadibdrumvqdrkc.supabase.co"
          DEFAULT_SUPABASE_PUBLISHABLE_KEY="sb_publishable_rEvIcwt1iF932n9otioBNg_dgPt7zRm"

          SUPABASE_URL="${INPUT_SUPABASE_URL:-$DEFAULT_SUPABASE_URL}"
          SUPABASE_PUBLISHABLE_KEY="${INPUT_SUPABASE_PUBLISHABLE_KEY:-$DEFAULT_SUPABASE_PUBLISHABLE_KEY}"

          SUPABASE_HOST="${SUPABASE_URL#https://}"
          SUPABASE_HOST="${SUPABASE_HOST#http://}"
          SUPABASE_HOST="${SUPABASE_HOST%%/*}"

          if [ -z "$SUPABASE_HOST" ]; then
            echo "VITE_SUPABASE_URL invalida: '$SUPABASE_URL'"
            exit 1
          fi

          if ! getent hosts "$SUPABASE_HOST" >/dev/null 2>&1; then
            echo "Host do Supabase nao resolve DNS: $SUPABASE_HOST"
            echo "Corrija o secret VITE_SUPABASE_URL no GitHub Actions antes de publicar."
            exit 1
          fi

          echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      - name: Build production
        run: npm run build

      - name: Install Wrangler CLI
        run: npm install --no-save wrangler@latest

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_PAGES_PROJECT_NAME" ]; then
            echo "Secret CLOUDFLARE_PAGES_PROJECT_NAME nao configurado."
            exit 1
          fi

          set +e
          CREATE_OUTPUT=$(npx wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT_NAME" --production-branch main 2>&1)
          CREATE_EXIT=$?
          set -e

          if [ $CREATE_EXIT -eq 0 ]; then
            echo "Projeto Pages criado com sucesso."
          elif echo "$CREATE_OUTPUT" | grep -Eqi "already exists|A project with this name already exists"; then
            echo "Projeto Pages ja existe."
          else
            echo "$CREATE_OUTPUT"
            echo "Falha ao criar projeto Pages. Verifique nome do projeto, account id e permissoes do token."
            exit $CREATE_EXIT
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: npx wrangler pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch="${{ github.ref_name }}"